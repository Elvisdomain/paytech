# ─────────────────────────────────────────────────────────────────────────────
# AWS CodeBuild — PayTech
#
# What this does:
#   1. Builds all 7 service images in parallel (using CodeBuild batch builds)
#   2. Pushes them to ECR
#   3. Renders ECS task definition revisions
#   4. Deploys each service to ECS Fargate via CodeDeploy (blue/green optional)
#
# Prerequisites:
#   - ECR repositories created for each service:
#       aws ecr create-repository --repository-name paytech/<service>
#   - ECS cluster and services pre-created (Terraform / CDK recommended)
#   - SSM Parameter Store entries:
#       /paytech/db/password       (SecureString)
#       /paytech/rabbitmq/url      (SecureString)
#       /paytech/api/keys          (SecureString)
#   - CodeBuild service role with:
#       AmazonEC2ContainerRegistryPowerUser
#       AmazonECS_FullAccess
#       AmazonSSMReadOnlyAccess
#
# Environment variables (set in CodeBuild project, not hardcoded here):
#   AWS_ACCOUNT_ID   your 12-digit account id
#   AWS_REGION       e.g. eu-west-1
#   ECS_CLUSTER      e.g. paytech-cluster
# ─────────────────────────────────────────────────────────────────────────────

version: 0.2

batch:
  fast-fail: false          # let all builds complete even if one fails
  build-list:
    - identifier: build_api_gateway
      env:
        variables:
          SERVICE: api-gateway
          PORT: "3000"
    - identifier: build_user_service
      env:
        variables:
          SERVICE: user-service
          PORT: "3001"
    - identifier: build_payment_service
      env:
        variables:
          SERVICE: payment-service
          PORT: "3002"
    - identifier: build_order_service
      env:
        variables:
          SERVICE: order-service
          PORT: "3003"
    - identifier: build_notification_service
      env:
        variables:
          SERVICE: notification-service
          PORT: "3004"
    - identifier: build_fraud_service
      env:
        variables:
          SERVICE: fraud-service
          PORT: "3005"
    - identifier: build_ledger_service
      env:
        variables:
          SERVICE: ledger-service
          PORT: "3006"

env:
  variables:
    AWS_REGION: eu-west-1                         # override in CodeBuild project
  parameter-store:
    # These are fetched at build time for the task definition render.
    # Actual runtime secrets are injected by ECS via Secrets Manager at launch.
    DB_PASSWORD:    /paytech/db/password
    RABBITMQ_URL:   /paytech/rabbitmq/url
    API_KEYS:       /paytech/api/keys

phases:
  pre_build:
    commands:
      # Authenticate Docker to ECR
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_REGION
          | docker login --username AWS --password-stdin
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - ECR_BASE=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/paytech
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:8}
      - echo "Image tag $IMAGE_TAG"

      # Run DB migrations before any service deploy
      # Uses a temporary ECS Fargate task (one-shot)
      - |
        TASK_DEF=$(aws ecs describe-task-definition \
          --task-definition paytech-migrate \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
        TASK_ARN=$(aws ecs run-task \
          --cluster $ECS_CLUSTER \
          --task-definition $TASK_DEF \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SG_IDS],assignPublicIp=DISABLED}" \
          --query 'tasks[0].taskArn' \
          --output text)
        echo "Waiting for migration task $TASK_ARN to complete..."
        aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN
        EXIT_CODE=$(aws ecs describe-tasks \
          --cluster $ECS_CLUSTER --tasks $TASK_ARN \
          --query 'tasks[0].containers[0].exitCode' --output text)
        if [ "$EXIT_CODE" != "0" ]; then
          echo "Migration task failed with exit code $EXIT_CODE"
          exit 1
        fi
        echo "Migrations complete."

  build:
    commands:
      - ECR_BASE=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/paytech
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:8}
      - IMAGE_URI=$ECR_BASE/$SERVICE:$IMAGE_TAG

      # Build using the service-specific Dockerfile, repo root as context
      - echo "Building $SERVICE..."
      - docker build -f services/$SERVICE/Dockerfile -t $IMAGE_URI -t $ECR_BASE/$SERVICE:latest .

      # Push both the commit-sha tag and latest
      - docker push $IMAGE_URI
      - docker push $ECR_BASE/$SERVICE:latest
      - echo "$IMAGE_URI" > /tmp/image_uri.txt

  post_build:
    commands:
      - ECR_BASE=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/paytech
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:8}
      - IMAGE_URI=$ECR_BASE/$SERVICE:$IMAGE_TAG

      # Render a new ECS task definition revision with the new image
      - |
        TASK_DEF=$(aws ecs describe-task-definition \
          --task-definition paytech-$SERVICE \
          --query 'taskDefinition' \
          --output json)

        NEW_TASK_DEF=$(echo $TASK_DEF \
          | jq --arg IMAGE "$IMAGE_URI" --arg PORT "$PORT" \
            '.containerDefinitions[0].image = $IMAGE
            | .containerDefinitions[0].portMappings[0].containerPort = ($PORT | tonumber)
            | del(.taskDefinitionArn, .revision, .status,
                  .requiresAttributes, .compatibilities,
                  .registeredAt, .registeredBy)')

        NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json "$NEW_TASK_DEF" \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)

        echo "New task def: $NEW_TASK_DEF_ARN"

        # Update the ECS service to use the new task definition
        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service paytech-$SERVICE \
          --task-definition $NEW_TASK_DEF_ARN \
          --force-new-deployment

        echo "Deployment triggered for paytech-$SERVICE"

artifacts:
  files:
    - "**/*"
  exclude-paths:
    - "**/node_modules/**"
