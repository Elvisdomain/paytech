name: Build & Push to Artifact Registry

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main          # production images on every merge to main
    paths-ignore:
      - "infra/terraform/**"   # infra changes don't rebuild app images
      - "**.md"
  pull_request:
    branches:
      - main          # build + lint on PRs, but don't push
  workflow_dispatch:  # allow manual runs from the Actions tab

# ── Permissions ───────────────────────────────────────────────────────────────
# Workload Identity Federation — no long-lived service account keys stored in
# GitHub Secrets. See "Setting up WIF" section in the README.
permissions:
  contents: read
  id-token: write   # required for WIF token exchange

# ── Shared env ────────────────────────────────────────────────────────────────
env:
  GAR_LOCATION: us-east1                                         # Artifact Registry region
  GAR_REPO:     paytech                                               # AR repository name
  # Full base path — images will be: $REGISTRY/api-gateway:abc1234
  REGISTRY:     us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/paytech

jobs:
  # ── Build matrix: one job per service, all run in parallel ─────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false    # let all services build even if one fails
      matrix:
        service:
          - api-gateway
          - user-service
          - payment-service
          - order-service
          - notification-service
          - fraud-service
          - ledger-service

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Authenticate to GCP via Workload Identity Federation ─────────────
      # No JSON key stored in secrets — WIF exchanges a short-lived OIDC token.
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account:            ${{ secrets.GCP_WIF_SA }}

      # ── 3. Configure Docker to push to Artifact Registry ────────────────────
      - name: Set up Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # ── 4. Set up Docker Buildx (layer caching support) ─────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. Derive image tags ─────────────────────────────────────────────────
      # We tag every image with:
      #   :latest          — always points to the most recent main build
      #   :<short-sha>     — immutable, what you reference in your k8s manifests
      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE_BASE="${{ env.REGISTRY }}/${{ matrix.service }}"
          echo "short_sha=$SHORT_SHA"         >> $GITHUB_OUTPUT
          echo "image_base=$IMAGE_BASE"       >> $GITHUB_OUTPUT
          echo "image_sha=$IMAGE_BASE:$SHORT_SHA"    >> $GITHUB_OUTPUT
          echo "image_latest=$IMAGE_BASE:latest"     >> $GITHUB_OUTPUT

      # ── 6. Build and push ────────────────────────────────────────────────────
      # Build context is always the repo root (shared/ is copied by every Dockerfile).
      # Registry push is skipped on pull requests — we only verify the build succeeds.
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context:    .
          file:       services/${{ matrix.service }}/Dockerfile
          push:       ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.tags.outputs.image_sha }}
            ${{ steps.tags.outputs.image_latest }}
          # GitHub Actions cache — speeds up repeat builds significantly
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max
          provenance: false   # keeps the manifest format compatible with older k8s tooling

      # ── 7. Output the pinned image reference ────────────────────────────────
      # Print the exact tag to use in Kubernetes manifests.
      - name: Image reference
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ ${{ matrix.service }}"
          echo "   ${{ steps.tags.outputs.image_sha }}"

  # ── Summary job: collects all image refs in one place ──────────────────────
  summary:
    name: Image summary
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print all image refs
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "## Built images — commit ${SHORT_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Use these tags in your Kubernetes manifests:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for svc in api-gateway user-service payment-service order-service \
                     notification-service fraud-service ledger-service; do
            echo "${{ env.REGISTRY }}/${svc}:${SHORT_SHA}"
          done >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
